name: Build Vista Linux ISO

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@110d3ab6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo add-apt-repository restricted -y`nsudo add-apt-repository universe -y`nsudo add-apt-repository multiverse -y
          sudo add-apt-repository multiverse -y
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap git xorriso syslinux isolinux

      - name: Build Vista Linux ISO
        run: |
          sudo chmod +x build.sh
          sudo ./build.sh

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4.4.0
        with:
          name: vista-linux-iso
          path: vista-linux-*.iso
          retention-days: 14

      - name: Create Release
        if: startsWith(github.ref, "refs/tags/") || github.event_name == "workflow_dispatch"
        uses: softprops/action-gh-release@v2
        with:
          files: vista-linux-*.iso
          tag_name: v${{ github.run_number }}
          name: Vista Linux Rolling Build ${{ github.run_number }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

